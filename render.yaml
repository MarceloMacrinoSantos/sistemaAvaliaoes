# Blueprint do Render: New + > Blueprint > selecione este repositório
services:
  - type: web
    name: sistema-avaliacoes
    runtime: docker
    plan: free
    region: virginia           # crie o banco do Neon na mesma região: AWS US East (N. Virginia)
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL        # cole a connection string do Neon (PostgreSQL gratuito)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_SENHA         # senha inicial do administrador (troque depois)
        sync: false
      - key: BCRYPT_ROUNDS       # login mais leve na CPU reduzida do plano gratuito
        value: "8"
# Correção por IA (opcional): adicione no painel do Render, em Environment, UMA ou mais destas chaves:
#   ANTHROPIC_API_KEY  GEMINI_API_KEY  DEEPSEEK_API_KEY   (e, se quiser, IA_ORDEM=gemini,claude,deepseek)
# Veja GUIA-IA.md. Não coloque chaves neste arquivo.
